<div class="app-shell">
  <app-sidebar />
  <main class="content-area">
    @if (dashboardFacade.activeNav$ | async; as activeNav) {
      <app-header [title]="activeNav" />
      <div class="content-body">
        @if (activeNav === 'Track Days') {
          <app-track-days />
        } @else if (activeNav === 'Vehicles') {
          <app-vehicles />
        } @else if (activeNav === 'Settings') {
          <app-settings />
        } @else {
          <app-dashboard />
        }
      </div>
    }
  </main>
</div>
