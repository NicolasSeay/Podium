@if (backLabel()) {
  <header class="create-header">
    <button type="button" class="ghost-button" (click)="goBack()">← {{ backLabel() }}</button>
    <span class="eyebrow">{{ eyebrow() }}</span>
    <h1>{{ title() }}</h1>
    @if (description()) {
      <p>{{ description() }}</p>
    }
  </header>
} @else {
  <header class="topbar">
    <div>
      <span class="eyebrow">{{ eyebrow() }}</span>
      <h1>{{ title() }}</h1>
    </div>
    <div class="top-actions">
      <button class="outline-button" type="button" disabled>⌕ <span>Search</span></button>
      @if (showNewTrackDay()) {
        <button class="primary-button" type="button" (click)="newTrackDay()">
          + New Track Day
        </button>
      }
    </div>
  </header>
}
