<section class="panel recent-panel">
  <div class="panel-heading">
    <div>
      <span class="eyebrow">Track days</span>
      <h2>Recent Track Days</h2>
    </div>
    <button class="ghost-button" type="button" disabled>View all <span>→</span></button>
  </div>
  <div class="recent-list">
    @for (day of days(); track day.id) {
      <div class="recent-row">
        <div class="date-block">
          <strong>{{ day.date }}</strong
          ><span>Track day</span>
        </div>
        <div class="day-main">
          <strong>Track {{ day.trackId }}</strong
          ><span>Vehicle {{ day.vehicleId }}</span>
        </div>
        <div class="lap-block">
          <strong>{{ day.id }}</strong
          ><span>Day ID</span>
        </div>
        <div class="improvement">{{ day.conditions || 'No conditions' }}</div>
        <span class="weather">{{ day.notes || '' }}</span>
      </div>
    }
  </div>
</section>
