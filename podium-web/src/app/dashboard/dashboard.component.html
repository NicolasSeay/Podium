@if (loading()) {
  <p class="muted" role="status">Loading dashboard...</p>
}
@if (error()) {
  <div role="alert">
    <p>{{ error() }}</p>
    <button class="outline-button" type="button" (click)="retry()">Retry</button>
  </div>
}
<div class="section-bar">
  <div>
    <span class="eyebrow">Performance snapshot</span>
    <h2>Welcome back, {{ firstName() }}</h2>
  </div>
  <div class="dashboard-filters">
    <select
      class="filter-select"
      [value]="selectedTrackId()"
      (change)="changeTrack($event)"
      aria-label="Filter by track"
    >
      @for (track of attendedTracks(); track track.id) {
        <option [value]="track.id">{{ track.name }}</option>
      }
    </select>
    <select
      class="filter-select"
      [value]="selectedVehicleId()"
      (change)="changeVehicle($event)"
      aria-label="Filter by vehicle"
    >
      @for (vehicle of vehicles(); track vehicle.id) {
        <option [value]="vehicle.id">{{ vehicle.name }}</option>
      }
    </select>
    <select
      class="range-select"
      [value]="range()"
      (change)="changeRange($event)"
      aria-label="Dashboard time range"
    >
      <option>Last 12 Months</option>
      <option>Last 6 Months</option>
      <option>This Year</option>
    </select>
  </div>
</div>
<div class="metrics-grid">
  <app-metric-card
    label="Best lap"
    [value]="bestLap()"
    detail="Personal record"
    icon="↗"
    [positive]="true"
  /><app-metric-card
    label="Track days"
    [value]="dashboard()?.totalTrackDays?.toString() ?? '--'"
    detail="All recorded days"
    icon="◷"
    [positive]="true"
  /><app-metric-card
    label="Total laps"
    [value]="dashboard()?.totalLaps?.toString() ?? '--'"
    detail="Across all sessions"
    icon="⌁"
  /><app-metric-card label="Seat time" [value]="seatTime()" detail="Driving time" icon="◒" />
</div>
<app-recent-days [days]="dashboard()?.recentTrackDays ?? []" />
